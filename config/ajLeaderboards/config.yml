config-version: 41

# ----- 以下のオプションは移動しました -----
# これらは messages.yml に移動しました。将来的にこのファイルからは削除される予定です。
# 現在は messages ファイルへ正常にコピーできるように一時的に残されているだけです。
# このファイルでこれらを変更しても効果はありません。変更する際は必ず messages.yml 内で編集してください。
no-data-name: "---"
no-data-score: "---"
# ^ 今後は messages.yml でこれらを変更してください