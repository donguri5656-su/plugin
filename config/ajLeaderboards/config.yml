#          各設定項目の上にあるコメントをよく読み、その項目が何をするものか確認してください。               #
#                                                                                                           #
#          質問がある場合は、まずその設定の上にあるコメントを読み、解決しない場合は                         #
#          Discord サーバーへお気軽にお越しください（招待リンクはプラグインページにあります）。             #
#                                                                                                           #
#          快適なセットアップを！                                                                           #
#                                                                                                           #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

# 【コメントに関する注意】この設定ファイルは必要に応じて自動更新されます。その際、設定値は保持されますが、コメントは上書きされます。
#  古い設定ファイルは常に別のファイル名でバックアップされるため、必要に応じて復元できますが、
#  このファイルにカスタムコメントを追加することは避けることをお勧めします。
#  デフォルトの設定ファイルはいつでも以下のURLから確認できます：https://wiki.ajg0702.us/ajQueue/configs/main


# オンラインプレイヤーの統計（スタッツ）をどのくらいの間隔で更新しますか？
#  ティック単位で指定します（20 ticks = 1秒）。
#  デフォルト: 1200 (60秒)
stat-refresh: 1200

# dontupdate（更新除外）権限のチェックを有効にしますか？
#  この権限を持つプレイヤーは、リーダーボードに追加または更新されなくなります。
#  権限名：ajleaderboards.dontupdate.<ボード名>
#  デフォルト: true
enable-dontupdate-permission: false

# プレースホルダーを読み込む際にスレッドをブロック（同期処理）しますか？
#  デフォルト設定の「auto」は、メインのサーバー・スレッド上にいない場合にのみブロックします。
#  true の場合、常にスレッドをブロックするため、ラグの原因になる可能性があります。
#  false の場合、処理中のスレッドをブロックしません（ただし、一瞬「Loading」と表示される場合があります）。
#  オプション: true, false, auto
#  デフォルト: auto
blocking-fetch: auto

# LuckPerms のコンテキスト（contexts）を登録しますか？
#  使用方法はこちらを参照してください：https://wiki.ajg0702.us/ajleaderboards/setup/luckperms-contexts
#  これを有効にする場合、実際に使用するものだけを登録するために、以下の「only-register-lpc-for」を構成することを強く推奨します。
#  デフォルト: false
register-lp-contexts: false

# どのボードとタイプに対して LuckPerms のコンテキストを計算しますか？
#  ここが空（かつ register-lp-contexts が有効）の場合、すべてのボードを対象に計算されます。
#  項目を追加する場合は「ボード名:タイプ」の形式で記述してください。
#  例: - "statistic_time_played:alltime"
#  末尾のタイプを省略した場合、そのボードのすべての期間タイプが対象になります：
#  例: - "statistic_time_played"
only-register-lpc-for: []

# ajLB（本プラグイン）のプレースホルダー内で、PlaceholderAPI のプレースホルダーを解析しますか？
#  これは「%ajlb_...」プレースホルダーにのみ適用されます。
#  プレースホルダーの処理ステップが1つ増えるため、一度に大量のプレースホルダーが要求された場合にラグが発生するリスクを考慮し、デフォルトでは無効になっています。
#  ただし、ほとんどのサーバーでは特に問題なく動作します。
#  有効にすると、「%ajlb_...」の内部で PlaceholderAPI のプレースホルダーを %% の代わりに {} で囲むことで使用できるようになります。
#  デフォルト: false
parse-placeholders-in-placeholders: false

# ここにリストされたボードは、逆順でソート（並び替え）されます。
#  例: 最も数値が高い人を一番上に表示する代わりに、ここに記述されたボードは最も数値が低い人が一番上に表示されます。
reverse-sort: []

# リーダーボードの看板をどのくらいの間隔（ティック単位）で更新しますか？
#  これはキャッシュから更新されます。キャッシュ自体の更新速度は「stat-refresh」で制御されます。
#  デフォルト: 20 (1秒間に1回)
sign-update: 20

# プレイヤーがサーバーに参加した際、すぐに統計を更新しますか？
#  無効にした場合でも更新は行われますが、「stat-refresh」で設定された間隔でのみ更新されます。
#  デフォルト: true
update-on-join: true

# プレイヤーがサーバーを退出した際、すぐに統計を更新しますか？
#  これは、プレイヤーがお金をすべて消費した直後に（ajlbの定期更新が入る前に）退出してデータが反映されない、といった現象を防ぐのに役立ちます。
#  デフォルト: true
update-on-leave: true

# これらはリーダーボードと並べて表示できる「拡張（extra）」プレースホルダーです。
#  例えば、KDR（キル・デス比）のリーダーボードを表示しながら、その横に各プレイヤーの実際のキル数やデス数を並べて表示できます。
#  詳細情報：https://wiki.ajg0702.us/ajleaderboards/setup/extras/
extras:
  - "statistic_player_kills"

# 期間制限付きタイプ（日別、週別、月別など）がリセットされる際、何位までの順位を保存しておきますか？
#  データは「past-resets」フォルダに保存されます。
#  0 または負の数を設定すると、保存機能が無効になります。
#  デフォルト: 10
reset-save-positions: 10

# どの期間タイプのデータを保存しますか？
#  「*」を指定すると、すべての期間タイプを保存します。
#  デフォルト: 毎時（hourly）を除くすべて
reset-save-types:
  - DAILY
  - WEEKLY
  - MONTHLY
  - YEARLY

# 桁数の多い数値の桁区切り（カンマなど）に使用する文字を指定します。
#  区切り文字を表示したくない場合は、ここを空欄に設定できます。
comma: ","

# 小数点に使用する文字を指定します。
decimal: "."

# 週別（WEEKLY）のリーダーボードは、何曜日にリセットしますか？
#  オプション: monday, tuesday, wednesday, thursday, friday, saturday, sunday
#  週別のリセットは、ここで指定した曜日の深夜0:00（一日の始まり）に実行されます。
#  大文字と小文字は区別されません。
#  デフォルト: sunday
reset-weekly-on: sunday

# 数値の後ろに表示する「値の名前（単位など）」を指定します。
#  デフォルト設定では、「statistic_player_kills」ボードの値の後に看板上で「kills」という名前が表示されます。
#  これは看板でのみ使用されます。より詳細な設定を行いたい場合は、messages.yml ファイル内の看板フォーマット（sign format）を変更してください。
value-names:
- "statistic_player_kills%kills"

# このサーバーでプレイヤーの統計（スタッツ）を更新しますか？
#  無効にすると、統計データはデータベースに記録されず、ajLeaderboards はデータの「読み取り」のみを行います。
#  これはロビーサーバーなどでリーダーボードを表示したいだけで、ロビーでの活動によって他のゲームサーバーでの統計データが上書きされるのを防ぎたい場合に便利です。
update-stats: true

# ここに記述されたボードのみを自動的に更新します。
#  空のリスト（デフォルト）の場合、すべてのボードが更新されます。
#  「update-stats」が無効に設定されている場合は、この設定よりもそちらが優先されます。
#  注意: ajLeaderboards のボード名はすべて大文字と小文字が区別されます。
#  デフォルト: []
only-update: []

# オフラインプレイヤーの統計を定期的に更新するボードを指定します。
#  これにより、指定されたボードにおいて現在オンラインではないプレイヤーの統計データが更新されます。
#  外部の別のプラグインやシステムで追跡されている統計を、リーダーボードに反映させたい場合に便利です。
#  オフラインの自動更新を無効にするには、空のままにしてください。
#  注意: すべてのプレースホルダーがオフラインプレイヤーに対応しているわけではありません。オフラインでも動作することが分かっているボードのみ指定してください。
#  デフォルト: []
offline-update-boards: []

# オフラインプレイヤーの統計をどのくらいの間隔（時間単位）で更新しますか？
#  「offline-update-boards」が空ではない場合にのみ適用されます。
#  反映させるにはサーバーの再起動が必要です。
#  デフォルト: 6
offline-update-interval-hours: 6

# プラグイン（サーバー）起動時に、オフラインプレイヤーの更新処理を実行しますか？
#  「offline-update-boards」が空ではない場合にのみ適用されます。
#  デフォルト: false
offline-update-run-on-startup: false

# プレイヤーのスコアが 0 になった場合（以前は 0 ではなかった場合）、ajLeaderboards は最初そのプレイヤーの更新をスキップします。
#  これは、統計データをロード中に一時的に「0」を返すプラグインへの対策です。
#  次回の更新時にもスコアが 0 のままであれば、その時点で「0」として反映・表示されます。
#  デフォルト: true
require-zero-validation: true

# 数値が整数であっても、常に小数点以下を表示するボードを指定します。
#  例えば、プレイヤーのKDRが整数（例: 2）であっても、小数点を含めて表示（例: 2.00）したい場合は、ここにボード名を追加します。
#  小数点以下の表示桁数を増やしたい場合は、ボード名の後に「%」と数値を付けて指定することもできます。
#  例えば、「kdr_ratio」というボードで最低1桁の小数点以下を常に表示したい場合は、リストに「kdr_ratio」を追加します。
#  また、「vault_eco_balance」というボードで常に小数点以下2桁を表示させたい場合は、リストに「vault_eco_balance%2」を追加します。
show-zero-decimal: []

# リーダーボード上で数値を表示する際、小数点以下何桁で丸めますか？
#  ajLeaderboards 自体は最大5桁の小数点データを保持できますが、見栄えを考慮してデフォルトでは小数点以下2桁に四捨五入（丸め処理）されます。
#  デフォルト: 2
round-decimal-places: 2

# ここにリストされたボードでは、スコアが「0」のプレイヤーはリーダーボードに追加されません。
dont-add-zero: []

# Vault からプレイヤーの接頭辞（Prefix）/接尾辞（Suffix）を取得しますか？
#  Vault がインストールされていない場合、このオプションは何もしません（接頭辞や接尾辞は取得されません）。
#  デフォルト: true
fetch-prefix-suffix-from-vault: true

# 時間の表示フォーマットに「秒」を含めますか？
#  これは、ajLeaderboards から直接値を表示する場所にのみ影響します。
#  例えば、true の場合:  1d 3h 21m 2s
#         false の場合: 1d 3h 21m
#  デフォルト: true
time-format-display-seconds: true

# 上記のオプションと似ていますが、こちらは「週（weeks）」を含めるかどうかの設定です。
#  例えば、true の場合:  2w 3d 20h 4m 8s
#         false の場合:   17d 20h 4m 8s
time-format-display-weeks: true

# カスタムの bytebin 保存先やウェブビューア（webviewer）のリンクを設定できます。
#  /ajlb viewer を実行した際、統計データを開発者のサーバーに送信したくない場合にのみ変更してください。
#  （送信されたデータは最大90日間保持されますが、希望すれば早期に削除するよう開発者に連絡することもできます）
bytebin-link: "https://bytebin.ajg0702.us/post"
web-link: "https://ajlb-viewer.ajg0702.us/?id={code}"


# デベロッパー（開発者）にとって有用な情報をコンソールに出力するデバッグオプションです。
#  何をしているか分かっている場合や、オンにするように指示された場合を除き、通常は無効（false）のままにしておくことをお勧めします。
#  デフォルト: false
debug: false

# 統計の更新に関する追加のデバッグ情報を出力しますか？
#  この設定を有効にするには、「debug」が true に設定されている必要があります。
#  デフォルト: false
update-de-bug: false

# プレイヤーの頭や防具立てがどこで検出されているかを示すために、デバッグ用のパーティクルを表示しますか？
#  デフォルト: false
particles: false

# データの取得（フェッチ）に関する内部処理の情報をより詳しく出力しますか？
#  通常、開発者から使用を求められた場合にのみ有効にしてください。
fetching-de-bug: false

# プレイヤーデータのキャッシュ状態をチェックしますか？
#  これを有効にすると、プレイヤーのスコアや情報に変更があった場合にのみ、更新リクエストが送信されます。
#  無効にすると、特定のプレイヤー情報を要求する別の処理があった場合にのみキャッシュが生成されます。
#  デフォルト: true
check-cache-on-update: true

# データベースからのデータ取得（フェッチ）頻度を増やしますか？
#  ajLeaderboards は、DBの応答が速いときはデータ取得頻度を増やし、応答が遅いときは頻度を減らします。
#  これを有効にすると、データベースからの取得頻度がより高くなります。
#  ほとんどのサーバーでは、この設定を有効にする必要はありません。
#  無効（false）の場合、最小リフレッシュ間隔は20秒に設定されます。
#  有効（true）の場合、最小リフレッシュ間隔は0.5秒になります（ただし、実際の最小値は通常1秒程度です）。
#  デフォルト: false
more-fetching: false

# プラグインのアップデートを確認しますか？
#  有効にすると、「/ajLeaderboards update」コマンドを実行するだけで手動でアップデートすることも可能になります。
#  この設定を変更した場合はサーバーの再起動が必要です。
enable-updater: true

# プラグインのシャットダウン処理を高速化するために、いくつかのステップをスキップしますか？
#  有効にすると、サーバーシャットダウン後に警告が表示される場合がありますが、シャットダウンの速度を大幅に高速化できます。
#  有効にしても不具合が発生することはありませんが、特別な理由がない限りは無効（false）のままにしておくことをお勧めします。
#  デフォルト: false
fast-shutdown: false

# 特定のプレイヤー情報（例: 順位データの取得など）をキャッシュしておく最小時間（ミリ秒単位）を指定します。
#  データベースの応答速度が低下している場合、キャッシュされたデータが通常より長く使用される場合があります。
#  デフォルト: 5000
min-player-cache-time: 5000

# ajLeaderboards がDBからのデータ取得に使用できるスレッドの最大数を指定します。
#  通常、実際に使用されるスレッド数はこの上限よりもはるかに少なくなります。
#  MySQL を使用している場合はこの設定は無視されます（代わりに「maxConnections」がスレッド制御に使用されます）。
#  「unable to create native thread: possibly out of memory or process/resource limits reached（ネイティブスレッドを作成できません：メモリ不足、またはプロセス/リソース制限に達した可能性があります）」というメッセージが表示される場合は、この値を下げてください。
#  この値を 16 未満に設定することは推奨しません。
#  変更を適用するにはサーバーの再起動が必要です。
#  デフォルト: 70
max-fetching-threads: 70

# コアスレッド以外の非アクティブスレッドを終了するまでに保持する時間（ミリ秒単位）を指定します。
#  これにより、データをフェッチ（取得）するたびに新しいスレッドを作成するコストを回避し、既存のスレッドを再利用できます。
#  スレッドの新規作成には高い負荷がかかりますが、長時間保持しすぎるとリソースを無駄に消費します。
#  この値を 500 未満に設定することは推奨しません。
#  徹底的なテストの結果、ajLeaderboards にとっては 500 という値が最も適していることが判明しています。
#  変更を適用するにはサーバーの再起動が必要です。
#  デフォルト: 500
fetching-thread-pool-keep-alive: 500


